[package]
name = "jupyvim"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeromq = "0.6"
notify = "6.1"
clap = { version = "4.5", features = ["derive"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.0", features = ["v4"] }
bytes = "1.0"
futures = "0.3"
