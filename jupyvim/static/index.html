<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jupyvim Preview</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="logo-badge">
                <span class="logo-icon">⚡</span> JUPYVIM
            </div>
            <div id="filename-display" class="filename-badge">Loading notebook...</div>
        </div>
        <div class="header-center">
            <button id="run-all-btn" class="toolbar-btn primary" title="Run All Cells">▶ Run All</button>
            <button id="clear-outputs-btn" class="toolbar-btn" title="Clear All Outputs">⟳ Clear Outputs</button>
            <span class="readonly-hint">Edit in Neovim — this view is read-only</span>
        </div>
        <div class="header-right">
            <div id="kernel-status" class="kernel-status disconnected">
                <span class="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
        </div>
    </header>

    <main class="notebook-container">
        <div id="cells-container">
            <!-- Dynamically populated by app.js -->
        </div>
    </main>

    <script src="/app.js"></script>
</body>
</html>
